{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Glow Salon{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'salon/style.css' %}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{% url 'home' %}">Glow<span>Salon</span></a>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'services' %}">Services</a>
      <a class="btn small" href="{% url 'book' %}">Book now</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <p>&copy; Glow Salon, Kisii &middot; Open Mon-Sat 8am - 7pm</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
