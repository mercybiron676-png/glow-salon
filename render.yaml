services:
  - type: web
    name: glow-salon
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: glow-salon-db
          property: connectionString
      # Add these in the Render dashboard (leave empty for demo mode):
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_CALLBACK_URL
        sync: false

databases:
  - name: glow-salon-db
    plan: free
